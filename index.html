<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This app is always dark by design (see App.tsx's hardcoded `dark` class
         and slate-900/black theme.bg) — it never adapts to the OS light/dark
         preference. Without declaring that explicitly, some browsers (Chrome's
         "Force dark mode for web content" flag/setting, some Android WebViews,
         certain accessibility color-inversion tools) apply their own automatic
         color-inversion heuristic on top of the page — which reads as exactly
         a dark UI getting flipped to a washed-out light background with dark
         text, and any inline color a user picks (e.g. the paragraph font
         color) getting silently re-inverted back over. Declaring color-scheme
         tells the browser this page already handles its own dark styling, so
         it leaves the colors alone. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020617" />
    <title>Endo Canvas</title>
    <!-- Tailwind and the app stylesheet are compiled at build time; see
         styles/app.css, imported from index.tsx. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
</head>
  <body>
    <!-- SVG Symbols for Switch Animation -->
    <svg style="display: none;">
      <symbol id="light" viewBox="0 0 24 24">
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(0,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(45,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(90,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(135,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(180,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(225,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(270,12,12)" />
          <line x1="12" y1="17" x2="12" y2="20" transform="rotate(315,12,12)" />
        </g>
        <circle fill="currentColor" cx="12" cy="12" r="5" />
      </symbol>
      <symbol id="dark" viewBox="0 0 24 24">
        <path fill="currentColor" d="M15.1,14.9c-3-0.5-5.5-3-6-6C8.8,7.1,9.1,5.4,9.9,4c0.4-0.8-0.4-1.7-1.2-1.4C4.6,4,1.8,7.9,2,12.5c0.2,5.1,4.4,9.3,9.5,9.5c4.5,0.2,8.5-2.6,9.9-6.6c0.3-0.8-0.6-1.7-1.4-1.2C18.6,14.9,16.9,15.2,15.1,14.9z" />
      </symbol>
    </svg>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
